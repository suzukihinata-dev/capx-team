[project]
name = "capx-agent"
version = "0.0.1"
description = "CaP-X agent (skeleton: shared inference server + isolated parallel trials)"
requires-python = ">=3.10"
# エージェント固有の軽い依存はここに追加し、uv lock でロックしてから PR を出す。
# CUDA・推論サーバー・シミュレータに関わる依存は env/ 側（環境担当）に依頼する。
dependencies = []

[project.scripts]
capx-run = "capx_agent.runner:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capx_agent"]
